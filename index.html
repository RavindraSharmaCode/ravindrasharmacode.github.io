<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PowerShell Notes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    /* 1. HIDE THE WATERMARK */
    /* This targets every possible way that 'powershell' text is shown */
    .markdown-section pre::before,
    .markdown-section pre::after,
    [data-lang]::before,
    [data-lang]::after {
      content: none !important;
      display: none !important;
      visibility: hidden !important;
    }

    /* 2. REMOVE EXTRA TOP SPACE */
    .markdown-section pre {
      padding: 0 !important;
      margin: 1.2em 0 !important;
      position: relative !important;
      background: #f8f8f8 !important;
      overflow: hidden !important; /* Clips any ghost elements */
    }

    .markdown-section pre > code {
      padding: 15px !important;
      padding-top: 15px !important; /* Code starts at the very top */
      display: block !important;
    }

    /* 3. SOLID COPY BUTTON (Covers anything behind it) */
    .docsify-copy-code-button {
      opacity: 1 !important;
      background: #42b983 !important; /* Vue Green */
      color: #ffffff !important;
      padding: 6px 12px !important;
      border-radius: 0 0 0 6px !important; /* Rounded only on bottom-left */
      z-index: 999 !important;
      border: none !important;
      font-weight: bold !important;
      top: 0 !important;   /* Aligns to the absolute top */
      right: 0 !important; /* Aligns to the absolute right */
    }

    /* 4. SEARCH BAR */
    .search input {
      border: 1px solid #ddd !important;
      margin: 10px 0;
      padding: 5px;
    }
  </style>
</head>
<body>
  <div id="app">Loading...</div>
  <script>
    window.$docsify = {
      name: 'PowerShell Notes',
      loadSidebar: true,
      subMaxLevel: 2,
      search: 'auto',
      copyCode: {
        buttonText : 'Copy',
        successText: 'Copied'
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>
</body>
</html>
