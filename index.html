<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PowerShell Notes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    /* 1. HIDE THE WATERMARK VIA CSS */
    pre[data-lang]::before {
      content: none !important;
      display: none !important;
    }

    /* 2. STYLE THE COPY BUTTON */
    .docsify-copy-code-button {
      opacity: 1 !important;
      background: #42b983 !important;
      color: white !important;
      border-radius: 4px !important;
      padding: 6px 10px !important;
    }

    /* 3. ENSURE CONTENT DOESN'T OVERLAP */
    .markdown-section pre {
      padding-top: 2.5em !important;
    }
  </style>
</head>
<body>
  <div id="app">Loading...</div>
  <script>
    window.$docsify = {
      name: 'PowerShell Notes',
      loadSidebar: true,
      subMaxLevel: 2,
      homepage: 'README.md',
      // Enable Search
      search: 'auto',
      copyCode: {
        buttonText : 'Copy',
        successText: 'Copied'
      }
    }
  </script>

  <!-- Docsify v4 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  
  <!-- Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>

  <!-- SCRIPT TO REMOVE WATERMARK MANUALLY -->
  <script>
    // This removes the 'data-lang' attribute from all code blocks 
    // after Docsify finishes rendering the page.
    hook.doneEach(function() {
      document.querySelectorAll('pre').forEach(function(el) {
        el.setAttribute('data-lang', '');
      });
    });
  </script>
</body>
</html>
