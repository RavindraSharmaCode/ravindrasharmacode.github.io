<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PowerShell Notes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <style>
    /* This hides the "powershell" watermark text */
    code[class*="language-"]::before {
      display: none !important;
    }

    /* This makes the copy button look cleaner */
    .docsify-copy-code-button {
      background: #f8f8f8 !important;
      color: #333 !important;
      font-size: 0.8rem !important;
      border: 1px solid #ddd !important;
      border-radius: 4px !important;
    }
  </style>
</head>
<body>
  <div id="app">Please wait, loading notes...</div>
  <script>
    window.$docsify = {
      name: 'PowerShell Notes',
      loadSidebar: true,
      subMaxLevel: 2,
      copyCode: {
        buttonText : 'Copy', // Change to '' if you want ONLY an icon (requires FontAwesome)
        errorText  : 'Error',
        successText: 'Copied'
      }
    }
  </script>
  
  <!-- Required Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  
  <!-- Copy Button Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  
  <!-- PowerShell Language Support -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>
</body>
</html>
