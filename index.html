<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PowerShell Notes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <style>
    /* THE BRUTE FORCE WATERMARK KILLER */
    /* This targets every possible way that 'powershell' text is injected */
    pre[data-lang]::before, 
    pre[data-lang]::after,
    .markdown-section pre::before,
    .markdown-section pre::after,
    code[class*="language-"]::before,
    code[class*="language-"]::after {
      display: none !important;
      content: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
    }

    /* Keep the Copy Button visible and pretty */
    .docsify-copy-code-button {
      opacity: 1 !important;
      background: #42b983 !important;
      color: #fff !important;
      border-radius: 4px !important;
      padding: 5px 10px !important;
    }

    .markdown-section pre {
        padding-top: 2.5em !important;
    }
  </style>
</head>
<body>
  <div id="app">Loading...</div>
  <script>
    window.$docsify = {
      name: 'PowerShell Notes',
      loadSidebar: true,
      subMaxLevel: 2,
      homepage: 'README.md',
      copyCode: {
        buttonText : 'Copy',
        successText: 'Copied'
      }
    }
  </script>
  
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>

  <!-- JavaScript Fallback to remove watermark if CSS fails -->
  <script>
    document.addEventListener('click', function() {
        // Every time you click (navigate), we strip the labels
        setTimeout(() => {
            document.querySelectorAll('pre').forEach(pre => {
                pre.setAttribute('data-lang', '');
            });
        }, 500);
    });
  </script>
</body>
</html>
