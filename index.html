<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PowerShell Notes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    /* 1. REMOVE WATERMARK & REDUCE SPACE */
    /* Target the exact selector Docsify uses for the 'powershell' label */
    .markdown-section pre[data-lang]::before {
      content: none !important; /* Kills the text */
      display: none !important; /* Removes the element */
    }

    /* Remove the extra padding at the top of code boxes */
    .markdown-section pre {
      padding: 1.2em !important; /* Standard even padding */
      margin: 1.2em 0 !important;
      position: relative;
    }

    /* 2. STYLE THE COPY BUTTON */
    .docsify-copy-code-button {
      background: #42b983 !important;
      color: white !important;
      border: none !important;
      border-radius: 4px !important;
      padding: 4px 8px !important;
      font-weight: bold !important;
      opacity: 1 !important; /* Make it always visible */
    }

    /* 3. FIX SEARCH BAR VISIBILITY */
    .search input {
      background-color: #f3f3f3 !important;
      border-radius: 5px !important;
    }
  </style>
</head>
<body>
  <div id="app">Loading...</div>
  <script>
    window.$docsify = {
      name: 'PowerShell Notes',
      loadSidebar: true,
      subMaxLevel: 2,
      // Search Plugin Config
      search: {
        placeholder: 'Search...',
        noData: 'No results!',
        depth: 6
      },
      // Copy Code Config
      copyCode: {
        buttonText: 'Copy',
        successText: 'Copied'
      }
    }
  </script>

  <!-- Essential Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  
  <!-- Search Plugin (Must be after docsify.js) -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  
  <!-- Copy Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  
  <!-- Language Support -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>

  <!-- Final Watermark Purge -->
  <script>
    // This script runs every time a page is loaded to manually strip the lang attribute
    window.$docsify.plugins = [].concat(function(hook) {
      hook.doneEach(function() {
        var codes = document.querySelectorAll('pre');
        codes.forEach(function(code) {
          code.setAttribute('data-lang', ''); // Effectively deletes the watermark source
        });
      });
    }, window.$docsify.plugins);
  </script>
</body>
</html>
