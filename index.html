<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PowerShell Notes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <style>
    /* 1. COMPLETELY HIDE THE LANGUAGE WATERMARK */
    /* This targets the common selectors for the language label */
    .markdown-section pre > code::before,
    .markdown-section pre::before,
    code[class*="language-"]::before,
    [data-lang]::before {
      content: none !important;
      display: none !important;
    }

    /* 2. MAKE THE COPY BUTTON ALWAYS VISIBLE */
    /* By default, it only shows on hover. This makes it stay visible. */
    .docsify-copy-code-button {
      opacity: 1 !important;
      background: #eeeeee !important;
      padding: 5px 8px !important;
      border: 1px solid #ccc !important;
      border-radius: 4px !important;
      color: #333 !important;
    }

    /* Position adjustment to ensure it doesn't overlap text */
    .markdown-section pre {
      position: relative;
      padding-top: 30px !important;
    }
  </style>
</head>
<body>
  <div id="app">Please wait, loading notes...</div>
  <script>
    window.$docsify = {
      name: 'PowerShell Notes',
      loadSidebar: true,
      subMaxLevel: 2,
      copyCode: {
        buttonText : 'Copy',
        errorText  : 'Error',
        successText: 'Copied'
      }
    }
  </script>
  
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>
</body>
</html>
