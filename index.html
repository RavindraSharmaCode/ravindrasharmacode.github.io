<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PowerShell Notes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Theme: Simple and Clean -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app">Please wait, loading notes...</div>
  <script>
    window.$docsify = {
      name: 'PowerShell Notes',
      repo: '',
      loadSidebar: true, // Look for _sidebar.md
      subMaxLevel: 2,    // Show ## headings in sidebar
      auto2top: true,    // Scroll to top when changing pages
    }
  </script>
  <!-- Main Docsify Script -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- PowerShell Syntax Highlighting -->

</body>
</html>
