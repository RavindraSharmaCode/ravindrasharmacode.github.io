<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PowerShell Notes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    /* 1. THE ULTIMATE WATERMARK KILLER */
    /* This targets the specific labels created by Docsify and the Copy plugin */
    .markdown-section pre::before,
    .markdown-section pre::after,
    .markdown-section code::before,
    .markdown-section code::after {
      content: none !important;
      display: none !important;
    }

    /* 2. REMOVE EXTRA SPACE & RE-ALIGN CODE BOX */
    .markdown-section pre {
      padding: 0 !important; /* Removes internal padding */
      margin: 1.5em 0 !important;
      background-color: #f8f8f8 !important;
      overflow: visible !important; /* Ensures copy button isn't cut off */
    }

    .markdown-section pre > code {
      padding: 15px !important; /* Sets a clean, uniform space inside the box */
      display: block;
    }

    /* 3. STYLE THE COPY BUTTON (Positioned correctly with no overlap) */
    .docsify-copy-code-button {
      background: #42b983 !important;
      color: #fff !important;
      border-radius: 4px !important;
      font-weight: bold !important;
      padding: 5px 8px !important;
      outline: none !important;
    }

    /* 4. SEARCH BAR FIX */
    .search {
      padding: 10px;
    }
    .search input {
      border-radius: 20px !important;
      background: #f3f3f3 !important;
    }
  </style>
</head>
<body>
  <div id="app">Loading...</div>
  <script>
    window.$docsify = {
      name: 'PowerShell Notes',
      loadSidebar: true,
      subMaxLevel: 2,
      // Search configuration
      search: 'auto',
      copyCode: {
        buttonText: 'Copy',
        successText: 'Copied'
      }
    }
  </script>

  <!-- Scripts in correct order -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>

  <!-- This script forcibly wipes the 'data-lang' attribute after rendering -->
  <script>
    window.$docsify.plugins = [].concat(function(hook) {
      hook.doneEach(function() {
        document.querySelectorAll('pre').forEach(el => {
          el.removeAttribute('data-lang');
        });
      });
    }, window.$docsify.plugins);
  </script>
</body>
</html>
