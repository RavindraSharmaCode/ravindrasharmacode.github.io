<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PowerShell Notes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    /* 1. HIDE THE WATERMARK TEXT (The 'powershell' label) */
    /* This targets the exact element seen in your screenshot */
    pre[data-lang]::before {
      content: none !important;
      display: none !important;
    }

    /* 2. REMOVE THE EXTRA TOP SPACE */
    .markdown-section pre {
      padding: 0 !important; /* Removes the container padding */
      margin: 1.2em 0 !important;
      position: relative !important;
      background: #f8f8f8 !important;
    }

    .markdown-section pre > code {
      padding: 15px !important; /* Standard padding inside the box */
      padding-top: 15px !important; /* Ensures no gap at the top */
      display: block !important;
    }

    /* 3. POSITION THE COPY BUTTON CLEANLY */
    .docsify-copy-code-button {
      opacity: 1 !important;
      background: #42b983 !important;
      color: #fff !important;
      border-radius: 0 4px 0 4px !important; /* Matches the top right corner */
      padding: 5px 10px !important;
      z-index: 10 !important;
      border: none !important;
    }

    /* 4. SEARCH BAR FIX */
    .search input {
      border: 1px solid #ddd !important;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div id="app">Loading...</div>
  <script>
    window.$docsify = {
      name: 'PowerShell Notes',
      loadSidebar: true,
      subMaxLevel: 2,
      search: 'auto',
      copyCode: {
        buttonText : 'Copy',
        successText: 'Copied'
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>
</body>
</html>
