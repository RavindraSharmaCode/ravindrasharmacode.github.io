<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PowerShell Notes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app">Please wait, loading notes...</div>
  <script>
    window.$docsify = {
      name: 'PowerShell Notes',
      loadSidebar: true,
      subMaxLevel: 2,
      // FIX 1: Explicitly tell Docsify to use README.md as the home
      homepage: 'README.md', 
      // FIX 2: Ensure it looks in the correct folder on GitHub
      basePath: './',
      relativePath: true
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>
</body>
</html>
