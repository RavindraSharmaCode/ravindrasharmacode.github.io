<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PowerShell Notes</title>
  <!-- Using the standard theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <style>
    /* 1. THE WATERMARK KILLER */
    /* This targets the 'powershell' text and shrinks its container to zero */
    pre[data-lang]::before {
      content: none !important;
      display: none !important;
      height: 0 !important;
      padding: 0 !important;
      margin: 0 !important;
    }

    /* 2. FIX THE GAPS */
    .markdown-section pre {
      padding: 0 !important;
      margin: 1.2em 0 !important;
    }

    /* This creates the clean, even space inside the box */
    .markdown-section pre > code {
      padding: 15px !important; 
      display: block !important;
      position: relative;
    }

    /* 3. SEARCH BAR VISIBILITY */
    /* Forces the search input to have a border so you can see it */
    .search input {
      border: 1px solid #ddd !important;
      margin: 10px 0;
    }

    /* 4. COPY BUTTON POSITION */
    .docsify-copy-code-button {
      background: #42b983 !important;
      color: white !important;
      border-radius: 4px !important;
      padding: 4px 8px !important;
    }
  </style>
</head>
<body>
  <div id="app">Loading...</div>
  <script>
    window.$docsify = {
      name: 'PowerShell Notes',
      loadSidebar: true,
      subMaxLevel: 2,
      // Fixed Search Config
      search: {
        placeholder: 'Search notes...',
        noData: 'No results',
        depth: 6
      },
      copyCode: {
        buttonText : 'Copy',
        successText: 'Copied'
      }
    }
  </script>

  <!-- Script order is critical for the Search Bar to show up -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>
</body>
</html>
